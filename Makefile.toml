[config]
default_to_workspace = false

[env]
CONTRACT_TARGET = "wasm32-unknown-unknown"
BUILD_PROFILE = "release"
WEB_CONTAINER_TOOL = "${HOME}/code/freenet/river/main/target/native/x86_64-unknown-linux-gnu/release/web-container-tool"
KEY_FILE = "${HOME}/.config/harvest/web-container-keys.toml"
# CONTRACT_ID will be set after first publish
# WEB_CONTAINER_TOOL and KEY_FILE will be configured for publishing

# --- Build tasks ---

[tasks.build-delegate]
description = "Build the harvest delegate WASM"
command = "cargo"
args = ["build", "--release", "--target", "${CONTRACT_TARGET}", "-p", "harvest-delegate"]

[tasks.build-contracts]
description = "Build all contract WASMs"
command = "cargo"
args = ["build", "--release", "--target", "${CONTRACT_TARGET}", "-p", "reputation-contract", "-p", "store-contract", "-p", "mailbox-contract"]

[tasks.sync-wasm]
description = "Copy built WASMs to UI public dir for embedding"
dependencies = ["build-delegate", "build-contracts"]
script = '''
mkdir -p ui/public/contracts
cp target/${CONTRACT_TARGET}/${BUILD_PROFILE}/harvest_delegate.wasm ui/public/contracts/
cp target/${CONTRACT_TARGET}/${BUILD_PROFILE}/store_contract.wasm ui/public/contracts/
cp target/${CONTRACT_TARGET}/${BUILD_PROFILE}/reputation_contract.wasm ui/public/contracts/
cp target/${CONTRACT_TARGET}/${BUILD_PROFILE}/mailbox_contract.wasm ui/public/contracts/
echo "Synced all WASMs to ui/public/contracts/"
'''

[tasks.build-ui]
description = "Build the Dioxus UI"
dependencies = ["sync-wasm", "build-contracts"]
script = '''
set -e
cd ui && dx build --${BUILD_PROFILE}
# dx doesn't copy CSS from assets/ to the build output root, so copy
# manually. Path is relative to `ui/` because we cd'd above and the
# script runs as one shell so the cwd persists.
cp assets/harvest.css ../target/dx/harvest-ui/${BUILD_PROFILE}/web/public/harvest.css
echo "CSS copied to build output"
'''

# --- Development tasks ---

[tasks.dev]
description = "Run UI in development mode with example data"
command = "dx"
args = ["serve", "--features", "example-data"]
cwd = "./ui"

[tasks.dev-no-sync]
description = "Run UI without Freenet connection"
command = "dx"
args = ["serve", "--features", "example-data,no-sync"]
cwd = "./ui"

[tasks.compress-webapp]
description = "Compress the UI into a tar.xz archive"
dependencies = ["build-ui"]
script = '''
mkdir -p target/webapp
cd target/dx/harvest-ui/${BUILD_PROFILE}/web/public && tar -cJf ../../../../../webapp/webapp.tar.xz *
echo "Compressed webapp to target/webapp/webapp.tar.xz"
'''

[tasks.sign-webapp]
description = "Sign the webapp archive with the web-container-tool"
dependencies = ["compress-webapp"]
script = '''
VERSION=$(( $(date +%s) / 60 ))
echo "Signing with version: $VERSION"
${WEB_CONTAINER_TOOL} sign \
  --input target/webapp/webapp.tar.xz \
  --output target/webapp/webapp.metadata \
  --parameters published-contract/webapp.parameters \
  --version $VERSION \
  --key-file ${KEY_FILE}
'''

[tasks.publish-harvest]
description = "Publish the Harvest UI to the Freenet network"
dependencies = ["sign-webapp"]
script = '''
set -e
fdev publish \
  --code published-contract/web_container_contract.wasm \
  --parameters published-contract/webapp.parameters \
  contract \
  --webapp-archive target/webapp/webapp.tar.xz \
  --webapp-metadata target/webapp/webapp.metadata
echo ""
echo "Published Harvest to Freenet"
'''

# --- Testing ---

[tasks.test]
description = "Run all tests"
command = "cargo"
args = ["test", "--workspace"]

[tasks.clippy]
description = "Run clippy on all targets"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
