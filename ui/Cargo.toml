[package]
name = "harvest-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Harvest decentralized marketplace UI"

[features]
default = []
example-data = []
no-sync = []

[dependencies]
harvest-common = { workspace = true }
ghostkey-common = { workspace = true }
freenet-bitcoin-common = { workspace = true }

# UI Framework
dioxus = { workspace = true }

# Web
# "Response" added for the bridge's public /v1/status HTTP endpoint (see
# gateway/bitcoin_bridge_http.rs) -- a plain browser `fetch`, not a Freenet
# gateway call, since that's the one piece of bridge discovery the delegate
# cannot do for us (delegates have no outbound-HTTP capability at all).
web-sys = { workspace = true, features = ["Response"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
gloo-timers = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
ciborium = { workspace = true }
serde_json = { workspace = true }

# Crypto
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
# "check" feature enables Base58Check decoding, needed to turn a legacy
# P2PKH/P2SH address string into its scriptPubKey (see gateway/bitcoin_address.rs).
bs58 = { workspace = true, features = ["check"] }
x25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
# Bech32/Bech32m decoding for SegWit address parsing (P2WPKH/P2WSH/P2TR).
# Not a workspace dependency -- only the UI needs to parse user-typed
# addresses into scriptPubKey bytes; every other crate in this workspace
# only ever handles scriptPubKey bytes directly.
bech32 = "0.11"

# Utilities
# Browser wasm, not a contract, so `wasmbind` is correct here -- the workspace
# default disables it because it makes CONTRACT modules unloadable.
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "wasmbind"] }
getrandom = { version = "0.2", features = ["js", "wasm-bindgen", "js-sys"], default-features = false }

# Freenet
freenet-stdlib = { workspace = true, features = ["net"] }
# The probe driver and the delegate export/import entry points. "ui" is the
# native+wasm profile, which is what a browser app wants -- and it keeps the
# migration logic testable natively, since none of it is behind a wasm gate.
freenet-migrate = { workspace = true, features = ["ui"] }

[build-dependencies]
chrono = "0.4"
# Turns legacy/*.toml into the lineage consts src/migrate.rs walks. Also
# re-derives each delegate row's key from its code hash and fails the build on
# a mismatch, so a mistyped registry is a build error rather than a probe that
# silently targets nothing.
freenet-migrate-build = "0.2"
