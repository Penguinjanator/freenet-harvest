[[entry]]
version = "V7"
description = "Superseded by the per-order Bitcoin payment address: the successor gained the BIP-84 public-derivation module and a new secret, `harvest:bitcoin:payment-xpub:v1`, holding the seller's account key AND its derivation counter. Carries the export handler, which matters more here than usual: that counter cannot be recovered from anywhere else. The orders a store has issued are public but they name SCRIPTS, not indices, so re-deriving forward finds the highest index ever USED rather than the highest ever HANDED OUT -- and the gap between those is exactly an address issued twice"
date = "2026-09-04"
