version = "V1"
description = "First delegate; RSA blind signing, listing management and transaction state. Also the WASM at ded0e3a -- 4feb95b built it and ded0e3a embedded the same bytes. No export handler, so its secrets are not recoverable"
date = "2026-04-16"
