# Superseded generations of the Harvest reputation contract.
#
# See README.md in this directory for the rules. Oldest first; the CURRENT
# generation is derived from the WASM this build ships and is never listed
# here.
#
# Instance ids are derived per seller: `BLAKE3(code_hash || cbor(
# ReputationParameters))`, whose fields are the seller's RSA public key (DER)
# and their ghostkey verifying key.
#
# THE RSA KEY IS THE ORDERING CONSTRAINT. `ReputationParameters
# .rsa_public_key_der` is exactly the value the harvest delegate holds under
# `harvest:rsa_pk:{fingerprint}` (see common/src/reputation.rs and
# delegates/harvest-delegate/src/handlers.rs). So a reputation instance id --
# for ANY generation, including the current one -- cannot be derived until the
# delegate's secrets have been carried forward. Probing reputation first does
# not merely fail to find anything: it would probe the WRONG ids and could seal
# a "nothing there" marker over a recoverable instance. `ui/src/migrate.rs`
# enforces the order in code.
#
# The state is an append-only (grow-only) set of feedback entries deduplicated
# by nonce, so folding generations is idempotent and cannot lose an entry.

