# Superseded generations of the Harvest mailbox contract.
#
# See README.md in this directory for the rules. Oldest first; the CURRENT
# generation is derived from the WASM this build ships and is never listed
# here.
#
# Instance ids are derived per owner: `BLAKE3(code_hash || cbor(
# MailboxParameters))`, whose single field is the owner's ghostkey verifying
# key. Like the store contract and unlike the reputation contract, that makes
# every generation derivable from the ghostkey alone, with no dependency on
# the delegate's secrets.
#
# The state is a set of encrypted messages deduplicated by nonce, with pruning
# by a TTL measured against the newest message the mailbox holds. Folding an
# old generation forward can therefore re-admit a message the successor had
# already pruned; that is harmless and self-correcting, because `apply_delta`
# re-runs the same deterministic prune on the folded result.

