[[entry]]
version = "V7"
description = "Superseded by the 2026-09-05 correctness review, and for this contract the substantive change is its own: retention stopped being governed by unauthenticated content. A 30-day TTL measured against the newest message present let one message dated far in the future evict every legitimate one, and made a mailbox permanently invalid the moment any message aged out; a `MAX_MESSAGES` count cap with a total, content-derived ranking replaces it. `harvest-common` is compiled into every artifact here, so its changes move these bytes whether or not this artifact's own behaviour changed. This generation carries the 2026-09-05 correctness review: `StoreStateV1::orders` gained `#[serde(default)]`, without which no V1 state decoded at all; `apply_delta` became all-or-nothing in orders, listings and feedback; the equal-rank order tie-break now keeps the SMALLER encoding and `AuthorizedOrder::verify` refuses any field the status does not consult, which together close a permanent third-party displacement of a paid order; a reversal now requires evidence the order was once covered; and confirmation depth is capped at what the bridge attested. The parameter structs also became `pub(crate)` with constructors so a second derivation no longer compiles -- a visibility change ONLY, not a field change: `cbor(StoreParameters)` is still 56 bytes and the V2..=V5 legacy parameter band is unaffected. `freenet-bitcoin-common` moved bbeed1e -> 0e5b9d9 for the attested-depth cap, and it links into all four artifacts as well. `scripts/build-contract-wasm.sh` is NOT among the causes: its reproducible-build fix landed in 47b67aa and was already in effect for the generation this supersedes"
date = "2026-09-05"
code_hash = "2eb1403aa35b94b8c6a0cbf252c7858e07b704740b0b76d4412871a643a78afa"
