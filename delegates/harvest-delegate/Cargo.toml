[package]
name = "harvest-delegate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Harvest delegate: RSA blind signing for feedback tokens, listing management, transaction state"

[features]
default = ["freenet-main-delegate"]
freenet-main-delegate = []

[dependencies]
harvest-common = { workspace = true }
freenet-stdlib = { workspace = true }
serde = { workspace = true }
ciborium = { workspace = true }
chrono = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]
