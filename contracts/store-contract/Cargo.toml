[package]
name = "store-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Harvest store contract: per-seller product listings with ghostkey-signed entries"

[dependencies]
harvest-common = { workspace = true }
freenet-stdlib = { workspace = true }
freenet-scaffold = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-contract"]
contract = ["freenet-stdlib/contract"]
freenet-main-contract = []
