[package]
name = "reputation-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Harvest reputation contract: append-only negative feedback with RSA blind signature verification"

[dependencies]
harvest-common = { workspace = true }
freenet-stdlib = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-contract"]
contract = ["freenet-stdlib/contract"]
freenet-main-contract = []
